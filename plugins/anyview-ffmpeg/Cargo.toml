[package]
name = "anyview-ffmpeg"
description = "The FFmpeg plugin: facts, pictures and exports of video and audio through the user's own ffprobe and ffmpeg programs, over plugin protocol v1. It runs them and links no libav."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "anyview-ffmpeg"
path = "src/main.rs"

[dependencies]
anyview-plugin-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
anyview-core = { workspace = true }
anyview-platform = { workspace = true }
anyview-plugin = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
