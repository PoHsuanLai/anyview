[package]
name = "anyview-raw"
description = "The RAW plugin: camera raw files developed in full, and their embedded previews as thumbnails, through the person's own LibRaw dcraw_emu or dcraw, over plugin protocol v1. It runs them and links no LibRaw."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "anyview-raw"
path = "src/main.rs"

[dependencies]
anyview-plugin-protocol = { workspace = true }
anyview-tool-kit = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
anyview-core = { workspace = true }
anyview-platform = { workspace = true }
anyview-plugin = { workspace = true }
image = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
