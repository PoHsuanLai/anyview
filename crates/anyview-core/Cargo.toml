[package]
name = "anyview-core"
description = "The viewer's pure vocabulary: kinds, sniffing, units, sequence, actions, edits, exports, view memory."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `LocalZone::pin`, for tests whose expected text names a time: a time zone every machine shares.
testing = []

[dependencies]
# The actions and chords of the keymap: a file action's own id and default chord.
chordkit = { workspace = true }
ds-core = { workspace = true }
infer = { workspace = true }
serde = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# `ds_core::testing::word_matches_serde`, for the stored `Word` enums.
ds-core = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
