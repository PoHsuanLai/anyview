[package]
name = "anyview-peek"
description = "The viewer's light tier: one peek per kind of file, the registry that maps every kind to its peek, and the pane that draws what was peeked at."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# `media` (on by default) is the recording's peek: libav reads its facts and, for audio, its cover.
# Off, a recording is peeked as a file of a kind with no back end: its type, size and date.
[features]
default = ["media"]
media = ["anyview-media/ffmpeg"]

[dependencies]
anyview-archive = { workspace = true }
anyview-core = { workspace = true }
anyview-font = { workspace = true }
anyview-image = { workspace = true }
# Without features: the error type the peek names. The `media` feature turns on `ffmpeg` (libav, a
# recording's facts and cover). Never `player`, so libmpv and the GPU player stay out of the
# launcher's tree.
anyview-media = { workspace = true }
anyview-text = { workspace = true }
dioxus = { workspace = true }
ds = { workspace = true }
# `pdf`: `pdf_thumb_blocking`, the first page of a PDF rasterised by pdfrum and cached. pdfrum is
# reached only through it.
ds-blitz = { workspace = true, features = ["pdf"] }
thiserror = { workspace = true }

[dev-dependencies]
ds-harness = { workspace = true, features = ["pdf"] }
ds-lint = { workspace = true }
dioxus-ssr = { workspace = true }
tempfile = { workspace = true }
# Builds the zip the archive peek reads (a test fixture, never a normal dependency).
zip = { workspace = true }

[lints]
workspace = true
