[package]
name = "anyview-peek"
description = "The viewer's light tier: one peek per kind of file, the registry that maps every kind to its peek, and the pane that draws what was peeked at."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# `media` (on by default) is the recording's peek: pure-Rust parsers read its facts and, for audio,
# its cover (symphonia, mp4parse, matroska-demuxer). Off, a recording is peeked as a file of a kind with no back end: its type, size and date.
# `pane` (on by default) is everything that draws or rasterises: the `Pane` component (dioxus) and a
# PDF's first page (ds-blitz, which brings the renderer). Off, a headless caller (a mail client
# peeking at attachments, a terminal) builds none of that, and a PDF is peeked as facts only.
[features]
default = ["media", "pane"]
media = ["dep:symphonia", "dep:mp4parse", "dep:matroska-demuxer"]
pane = ["dep:dioxus", "dep:ds", "dep:ds-blitz"]

[dependencies]
anyview-archive = { workspace = true }
anyview-book = { workspace = true }
anyview-core = { workspace = true }
anyview-font = { workspace = true }
anyview-image = { workspace = true }
anyview-text = { workspace = true }
ds-core = { workspace = true }
# The `pane` feature: the component, and the PDF page cache. Nothing outside `pane/` names a type of
# `ds` or dioxus, so a headless build links neither.
dioxus = { workspace = true, optional = true }
ds = { workspace = true, optional = true }
# `pdf`: `pdf_thumb_blocking`, the first page of a PDF rasterised by pdfrum and cached. pdfrum is
# reached only through it.
ds-blitz = { workspace = true, features = ["pdf"], optional = true }
thiserror = { workspace = true }
# The `media` feature: pure-Rust readers of a recording's header (never a decoder).
matroska-demuxer = { workspace = true, optional = true }
mp4parse = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }

[dev-dependencies]
ds = { workspace = true }
# Pins the time zone the expected dates are written in.
anyview-core = { workspace = true, features = ["testing"] }
ds-harness = { workspace = true, features = ["pdf"] }
ds-lint = { workspace = true }
dioxus-ssr = { workspace = true }
tempfile = { workspace = true }
# Builds the zip the archive peek reads (a test fixture, never a normal dependency).
zip = { workspace = true }

[lints]
workspace = true
