[package]
name = "anyview-media"
description = "Video and audio: the player session over the person's own mpv, run as a child process, and the plan, the names and the asks of the exports a plugin writes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# `player` is the session and the driver: mpv-wgpu's subprocess host and the GPU. The planning and
# naming of exports needs neither.
[features]
# No default features: a caller names the player and the sound card it links (the viewer asks for both).
default = []
player = ["dep:mpv-wgpu-player", "dep:wgpu", "dep:pollster"]
# `audio` is the built-in audio player: symphonia decodes (the decoders anyview-peek already links for
# probing) and cpal plays, for when the person has no mpv. Video and Opus still need mpv.
audio = ["dep:symphonia", "dep:cpal"]

[dependencies]
anyview-core = { workspace = true }
cpal = { workspace = true, optional = true }
ds-core = { workspace = true }
pollster = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
thiserror = { workspace = true }
wgpu = { workspace = true, optional = true }

# mpv-wgpu's host hands frames over a memfd ring and a `SOCK_SEQPACKET` socket: Linux's. Elsewhere
# `session::absent` has the same types and no session can be made (the built-in audio player and
# the person's own programs are what play there).
[target.'cfg(target_os = "linux")'.dependencies]
mpv-wgpu-player = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
