[package]
name = "anyview-media"
description = "Video and audio: the player session over the person's own mpv, run as a child process, and the plan, the names and the asks of the exports a plugin writes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# `player` is the session and the driver: mpv-wgpu's subprocess host and the GPU. The planning and
# naming of exports needs neither.
[features]
default = ["player"]
player = ["dep:mpv-wgpu-player", "dep:wgpu", "dep:pollster"]

[dependencies]
anyview-core = { workspace = true }
ds-core = { workspace = true }
mpv-wgpu-player = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
thiserror = { workspace = true }
wgpu = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
