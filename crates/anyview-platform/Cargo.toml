[package]
name = "anyview-platform"
description = "The platform edge: single instance, media session, thumbnail cache, print, share, reveal and window stacking, each a trait with a Linux implementation and a fake."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The Linux desktop's services: D-Bus (single instance with bus activation, the media session, the
# file chooser and print portals, the file manager) and the freedesktop application entries. Opt in:
# the default build is the traits, the portable implementations and the `testing` fakes, with no zbus.
# The code behind the feature is also gated on `target_os = "linux"`, so a build for another platform
# ignores it (quire design/36).
default = []
quire-desktop = ["dep:docket-provider", "dep:docket-core", "dep:docket-dbus", "dep:docket-vocab", "dep:docket-manifest", "dep:docket-wire", "dep:porter-ids", "dep:porter-core", "dep:prov", "dep:toml", "dep:zbus", "dep:memfd", "dep:futures-util"]
# The fakes (`anyview_platform::testing`), for the tests of the crates that consume the traits.
testing = ["dep:tempfile"]

[dependencies]
# Capped reads and atomic writes of the thumbnail and cover caches: quire's, shared by the desktop's apps.
ds-helpers = { workspace = true }
anyview-core = { workspace = true }
anyview-plugin = { workspace = true }
anyview-plugin-protocol = { workspace = true }
bayonet = { workspace = true, features = ["host"] }
dirs = { workspace = true }
ds-core = { workspace = true }
# The folder scan of Extensions and the file that turns some off; ds-settings without its D-Bus client reads that file.
ds-extensions = { workspace = true }
ds-settings = { workspace = true }
latchkey = { workspace = true }
log = { workspace = true }
md-5 = { workspace = true }
percent-encoding = { workspace = true }
png = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# Only a Linux build has a session bus and the freedesktop entries; `quire-desktop` names them.
[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { workspace = true, optional = true }
memfd = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }
docket-provider = { workspace = true, optional = true }
docket-core = { workspace = true, optional = true }
docket-dbus = { workspace = true, optional = true }
docket-vocab = { workspace = true, optional = true }
docket-manifest = { workspace = true, optional = true }
docket-wire = { workspace = true, optional = true }
prov = { workspace = true, optional = true }
porter-core = { workspace = true, optional = true }
porter-ids = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
# The integration tests use the fakes and, with `quire-desktop`, the private bus behind `testing`.
anyview-platform = { path = ".", default-features = false, features = ["testing"] }
tempfile = { workspace = true }

# The agent tests stand in for intentd with a fixture /proc, which docket-dbus reads only with
# `fixture-callers`: a test build's feature, never a shipped one (check-boundary.sh).
[target.'cfg(target_os = "linux")'.dev-dependencies]
docket-dbus = { workspace = true, features = ["fixture-callers"] }
