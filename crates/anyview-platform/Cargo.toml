[package]
name = "anyview-platform"
description = "The platform edge: single instance, media session, thumbnail cache, print, share, reveal and window stacking, each a trait with a Linux implementation and a fake."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The Linux desktop's services: D-Bus (single instance with bus activation, the media session, the
# file chooser and print portals, the file manager) and the freedesktop application entries. Opt in:
# the default build is the traits, the portable implementations and the `testing` fakes, with no zbus.
# The code behind the feature is also gated on `target_os = "linux"`, so a build for another platform
# ignores it (quire design/36).
default = []
quire-desktop = ["dep:docket-client", "dep:docket-core", "dep:porter-core", "dep:prov", "dep:toml", "dep:zbus", "dep:freedesktop-desktop-entry", "dep:memfd", "dep:futures-util"]
# The fakes (`anyview_platform::testing`), for the tests of the crates that consume the traits.
testing = ["dep:tempfile"]

[dependencies]
anyview-core = { workspace = true }
anyview-plugin = { workspace = true }
anyview-plugin-protocol = { workspace = true }
bayonet = { workspace = true, features = ["host"] }
dirs = { workspace = true }
ds-core = { workspace = true }
latchkey = { workspace = true }
md-5 = { workspace = true }
percent-encoding = { workspace = true }
png = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# Only a Linux build has a session bus and the freedesktop entries; `quire-desktop` names them.
[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-desktop-entry = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
memfd = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }
docket-client = { workspace = true, optional = true }
docket-core = { workspace = true, optional = true }
prov = { workspace = true, optional = true }
porter-core = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
# The integration tests use the fakes and, with `quire-desktop`, the private bus behind `testing`.
anyview-platform = { path = ".", default-features = false, features = ["testing"] }
tempfile = { workspace = true }
