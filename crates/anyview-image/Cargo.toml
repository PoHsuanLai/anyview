[package]
name = "anyview-image"
description = "Raster and vector images for the viewer: decode, downscaled peek, EXIF facts and orientation, encode for export, lossless JPEG rotation."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# AVIF decoding needs the dav1d C library (BSD-2-Clause, linked dynamically) and pkg-config.
# Off by default so the default build needs no C toolchain pieces.
avif = ["image/avif-native"]
# Writing pictures: the encoders (the AVIF one is ravif and rav1e, a large pure-Rust tree), the
# metadata carried across a re-encode (img-parts), the lossless-where-possible edits and the exports.
# Off, the crate only reads: a caller that peeks at pictures (a launcher, a mail client) links none of
# it. The viewer and its exports turn it on.
encode = ["dep:ravif", "dep:img-parts"]

[dependencies]
anyview-core = { workspace = true }
ds-core = { workspace = true }
# The pinned block enables png and jpeg; the other formats the viewer opens are added here.
image = { workspace = true, features = ["gif", "webp", "bmp", "tiff", "ico", "tga", "qoi", "exr", "hdr"] }
img-parts = { workspace = true, optional = true }
png = { workspace = true }
tiff = { workspace = true }
icns = { workspace = true }
psd = { workspace = true }
jxl-oxide = { workspace = true }
kamadak-exif = { workspace = true }
ravif = { workspace = true, optional = true }
resvg = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
