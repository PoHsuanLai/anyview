[package]
name = "anyview-plugin-fake"
description = "A tiny plugin that speaks protocol v1 for one invented kind, for the tests of discovery and the host. Also the shortest example of a plugin: the protocol crate and bayonet's fake plugin."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "anyview-fake-plugin"
path = "src/main.rs"

[dependencies]
anyview-plugin-protocol = { workspace = true }
bayonet = { workspace = true, features = ["testing"] }

[dev-dependencies]
anyview-core = { workspace = true }
anyview-platform = { workspace = true }
anyview-plugin = { workspace = true }
anyview-plugin-protocol = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
