[package]
name = "anyview-book"
description = "Books for the viewer: EPUB packages (metadata, reading order, contents, a chapter as sealed HTML) and comic zips (pages in natural order), and their covers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyview-archive = { workspace = true }
anyview-core = { workspace = true }
ds-core = { workspace = true }
roxmltree = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# `OnDisk`: the input of a book in the scratch folder (core opens no file).
anyview-fs = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true, features = ["deflate"] }

[lints]
workspace = true
