[package]
name = "anyview"
description = "The viewer binary: the command line, the host that carries out what the windows ask, the windows, and the program that wires everything else."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# `audio` is the built-in audio player (anyview-media's feature of the same name): audio plays with no mpv.
# Off, only the person's mpv plays.
#
# `quire-desktop` is the Linux desktop's services (anyview-platform's feature of the same name): D-Bus single
# instance with bus activation, the now-playing entry, the file chooser and print portals, the file manager,
# Open With, mail sharing. The viewer turns it on by default (Cargo has no per-target default);
# `--no-default-features` is the portable build, whose single instance is a per-user socket and whose desktop abilities are absent.
[features]
default = ["audio", "quire-desktop"]
audio = ["anyview-media/audio", "anyview-media-host/audio"]
quire-desktop = ["anyview-platform/quire-desktop", "ds-desktop/dbus"]

[dependencies]
anyview-core = { workspace = true }
# `OnDisk`: a path as the input the light tier reads (core does no I/O).
anyview-fs = { workspace = true }
anyview-export = { workspace = true, features = ["print"] }
anyview-image = { workspace = true, features = ["encode"] }
# `Trail`: the pure undo and redo machine the editing host steps.
anyview-machines = { workspace = true }
anyview-media = { workspace = true, features = ["player"] }
# The player host and the hub of sessions, which the pane links too.
anyview-media-host = { workspace = true }
anyview-pdf = { workspace = true }
anyview-peek = { workspace = true, features = ["media", "pane"] }
anyview-platform = { workspace = true }
anyview-plugin = { workspace = true }
anyview-plugin-protocol = { workspace = true }
anyview-runtime = { workspace = true }
anyview-store = { workspace = true }
anyview-ui = { workspace = true }
dioxus = { workspace = true }
ds = { workspace = true }
ds-blitz = { workspace = true }
ds-desktop = { workspace = true }
ds-extensions = { workspace = true }
ds-helpers = { workspace = true, features = ["quire-desktop"] }
ds-settings = { workspace = true, features = ["dioxus", "tokio"] }
futures-channel = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
notify = { workspace = true }
percent-encoding = { workspace = true }
thiserror = { workspace = true }
# `signal`: the session's SIGTERM and SIGHUP end the program by its normal way out.
tokio = { workspace = true, features = ["signal"] }
trash = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
ds-blitz = { workspace = true, features = ["testing"] }
anyview-platform = { workspace = true, features = ["testing"] }
ds-harness = { workspace = true }
image = { workspace = true }
tempfile = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }
# The desktop's wgpu opening lock, which the tests that open their own GPU take.
blitz-kit = { workspace = true, features = ["adapter"] }
