[package]
name = "anyview"
description = "The viewer binary: the threads that serve the machines (a bounded worker pool and the media actor), and the program that wires everything else."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# `audio` is the built-in audio player (anyview-media's feature of the same name): audio plays with no mpv.
# Off, only the person's mpv plays.
[features]
default = ["audio"]
audio = ["anyview-media/audio"]

[dependencies]
anyview-core = { workspace = true }
anyview-export = { workspace = true }
anyview-image = { workspace = true }
anyview-media = { workspace = true, features = ["player"] }
anyview-pdf = { workspace = true }
anyview-peek = { workspace = true }
anyview-platform = { workspace = true }
anyview-plugin = { workspace = true }
anyview-plugin-protocol = { workspace = true }
anyview-store = { workspace = true }
anyview-ui = { workspace = true }
dioxus = { workspace = true }
ds = { workspace = true }
ds-blitz = { workspace = true }
ds-helpers = { workspace = true }
ds-settings = { workspace = true, features = ["dioxus", "tokio"] }
futures-channel = { workspace = true }
futures-util = { workspace = true }
notify = { workspace = true }
percent-encoding = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
trash = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
anyview-platform = { workspace = true, features = ["testing"] }
ds-harness = { workspace = true }
image = { workspace = true }
tempfile = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }
