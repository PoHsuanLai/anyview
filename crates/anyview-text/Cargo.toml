[package]
name = "anyview-text"
description = "Text for the viewer: encodings and windowed lines, syntax highlighting into token classes, Markdown to HTML, CSV tables, spreadsheets and JSON trees."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyview-core = { workspace = true }
# `OpenFile`, the one way a path is opened (core does no I/O).
anyview-fs = { workspace = true }
ds-core = { workspace = true }
calamine = { workspace = true }
csv = { workspace = true }
encoding_rs = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
syntect = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Builds the workbook the sheet tests read: a test fixture, never a normal dependency.
zip = { workspace = true }

# Makes the named pipe the image reader must refuse.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true }

[lints]
workspace = true
