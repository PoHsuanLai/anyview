[package]
name = "anyview-ui"
description = "The viewer's pure state machines (chrome, panel, palette, sheet, navigation, presentation, loading, the four stages, key routing, the root) and the Dioxus views and stages that draw them."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyview-archive = { workspace = true }
anyview-book = { workspace = true }
anyview-core = { workspace = true }
# `OnDisk`: a path as the input the readers take (core does no I/O).
anyview-fs = { workspace = true }
anyview-image = { workspace = true, features = ["encode"] }
anyview-pdf = { workspace = true }
# The one probe and the card of a file no stage shows; no `pane` and no `media`: the window draws
# and plays with its own parts, and the host that links the peek turns both on.
anyview-peek = { workspace = true }
# The file's own details (dates, folder, permissions, where it came from) for the General section.
anyview-store = { workspace = true }
anyview-text = { workspace = true }
# The keymap's nouns (actions, chords, contexts): the viewer resolves its keys through them.
chordkit = { workspace = true }
dioxus = { workspace = true }
ds = { workspace = true }
ds-blitz = { workspace = true, features = ["pdf"] }
ds-core = { workspace = true }
ds-shell = { workspace = true }
futures-channel = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Pins the time zone the expected dates are written in.
anyview-core = { workspace = true, features = ["testing"] }
ds-harness = { workspace = true }
ds-lint = { workspace = true }
dioxus-ssr = { workspace = true }
image = { workspace = true }
tempfile = { workspace = true }
# Builds the EPUB and the comic the book window tests open (a fixture, never a normal dependency).
zip = { workspace = true }

[lints]
workspace = true
