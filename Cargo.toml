[workspace]
resolver = "3"
members = [
  "crates/anyview",
  "crates/anyview-archive",
  "crates/anyview-book",
  "crates/anyview-core",
  "crates/anyview-export",
  "crates/anyview-font",
  "crates/anyview-fs",
  "crates/anyview-image",
  "crates/anyview-media",
  "crates/anyview-platform",
  "crates/anyview-plugin",
  "crates/anyview-plugin-protocol",
  "crates/anyview-peek",
  "crates/anyview-plugin-fake",
  "crates/anyview-pdf",
  "crates/anyview-store",
  "crates/anyview-text",
  "crates/anyview-ui",
  "plugins/anyview-ffmpeg",
  "plugins/anyview-heif",
  "plugins/anyview-raw",
  "plugins/anyview-tool-kit",
]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT OR Apache-2.0"
# What pdfrum's crates declare (quire CONSUMING.md section 1); the toolchain itself is pinned in
# rust-toolchain.toml.
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/anyview"
publish = false

[workspace.dependencies]
anyview = { path = "crates/anyview" }
anyview-archive = { path = "crates/anyview-archive" }
anyview-book = { path = "crates/anyview-book" }
anyview-core = { path = "crates/anyview-core" }
anyview-export = { path = "crates/anyview-export" }
anyview-font = { path = "crates/anyview-font" }
anyview-fs = { path = "crates/anyview-fs" }
anyview-image = { path = "crates/anyview-image" }
anyview-media = { path = "crates/anyview-media", default-features = false }
# No default features: the viewer binary asks for the Linux desktop's services through its own
# `quire-desktop` feature, and a crate that needs only the portable half (plugin discovery) does not
# bring zbus along. `sill` takes the path directly and so gets the crate's own default.
anyview-platform = { path = "crates/anyview-platform", default-features = false }
anyview-plugin-fake = { path = "crates/anyview-plugin-fake" }
anyview-plugin = { path = "crates/anyview-plugin" }
anyview-plugin-protocol = { path = "crates/anyview-plugin-protocol" }
# No default features: the window (`anyview-ui`) takes the peek for its probe and its cards and draws and
# plays with its own parts, and the binary asks for `media` and `pane`. `sill` takes the path directly and
# so gets the crate's own default.
anyview-peek = { path = "crates/anyview-peek", default-features = false }
anyview-pdf = { path = "crates/anyview-pdf" }
anyview-store = { path = "crates/anyview-store" }
anyview-text = { path = "crates/anyview-text" }
anyview-ui = { path = "crates/anyview-ui" }
anyview-ffmpeg = { path = "plugins/anyview-ffmpeg" }
anyview-heif = { path = "plugins/anyview-heif" }
anyview-raw = { path = "plugins/anyview-raw" }
anyview-tool-kit = { path = "plugins/anyview-tool-kit" }
# bayonet runs the plugins (the wire, the manifest envelope, discovery, the registry and the process
# handling), generic over the capability type. No default features: a crate that
# only speaks the wire (the plugin programs) gets serde and nothing else, and the crates that run
# plugins ask for `host`.
bayonet = { git = "https://github.com/PoHsuanLai/bayonet.git", rev = "a295145be669417e01ba8e501b89de5a5a160dcf", default-features = false }
# quire, the design system, pinned by git rev: this is the one place to bump it (all six lines, and
# the same rev in the sill and shell manifests). The pin moves to the ~/desktop manifest later.
# A local checkout is used by a [patch."https://github.com/PoHsuanLai/quire.git"] block in a
# parent workspace, never here.
ds-core = { git = "https://github.com/PoHsuanLai/quire.git", rev = "8ce6d4b1a026247e286336a51c51d66e3ec7124b" }  # v0.3.6
# The design system and its Blitz host (the pane's components, `PdfFileThumb`'s page and
# `TextureLayer`), and the test driver and lint (dev-dependencies only).
ds = { git = "https://github.com/PoHsuanLai/quire.git", rev = "8ce6d4b1a026247e286336a51c51d66e3ec7124b" }  # v0.3.6
ds-blitz = { git = "https://github.com/PoHsuanLai/quire.git", rev = "8ce6d4b1a026247e286336a51c51d66e3ec7124b" }  # v0.3.6
# The one desktop appearance (`quire/appearance.toml` and the settings portal): the binary follows it.
ds-settings = { git = "https://github.com/PoHsuanLai/quire.git", rev = "8ce6d4b1a026247e286336a51c51d66e3ec7124b" }  # v0.3.6
# The missing-helper prompt: the sheet (ds-shell, drawn by the views) and the catalog, probe and
# PackageKit install behind it (ds-helpers, named only by the binary).
ds-helpers = { git = "https://github.com/PoHsuanLai/quire.git", rev = "8ce6d4b1a026247e286336a51c51d66e3ec7124b" }  # v0.3.6
# Which of quire's desktop services answer (PackageKit, for installing a missing tool). Without its
# `dbus` feature, which `quire-desktop` turns on, every service is absent and no D-Bus crate is linked.
ds-desktop = { git = "https://github.com/PoHsuanLai/quire.git", rev = "8ce6d4b1a026247e286336a51c51d66e3ec7124b" }  # v0.3.6
ds-shell = { git = "https://github.com/PoHsuanLai/quire.git", rev = "8ce6d4b1a026247e286336a51c51d66e3ec7124b" }  # v0.3.6
ds-harness = { git = "https://github.com/PoHsuanLai/quire.git", rev = "8ce6d4b1a026247e286336a51c51d66e3ec7124b" }  # v0.3.6
ds-lint = { git = "https://github.com/PoHsuanLai/quire.git", rev = "8ce6d4b1a026247e286336a51c51d66e3ec7124b" }  # v0.3.6

# ---- BEGIN PINNED BLOCK (source of truth: quire/docs/workspace-deps.toml) ----
# Copied verbatim into [workspace.dependencies] of quire, shell-host and sill. Bumped only by a
# dedicated "toolchain bump" wave that runs every repo's gates. Versions of the render stack
# (anyrender, vello, wgpu, parley) are the ones blitz's own Cargo.lock resolves at this rev;
# taffy (git) and stylo come through the blitz crates and are never named directly.

# The portable Blitz repairs (own repo, public). Local checkouts redirect it to a sibling path through
# each workspace root's [patch] (quire/CONSUMING.md section 1); git consumers get this rev.
blitz-kit = { git = "https://github.com/PoHsuanLai/blitz-kit", rev = "25b509987fa3347cd2a8a3858c7cdfabd3ba72ce" }

# Blitz: git main, pinned by rev (crates.io dioxus-native 0.8 alpha does not build with
# blitz 0.3.0-beta.2). The in-tree dioxus-native-dom targets dioxus 0.7.x.
# Blitz comes from our fork (github.com/PoHsuanLai/blitz, branch quire-pin): upstream e99fbdbd plus
# bf588142 (restyles elements whose animation was cancelled mid-way) and 1b23fbd9 (attributes carry no
# namespace, so `[data-x=y]` matches) (sill G295). Move back
# to DioxusLabs/blitz when a toolchain-bump wave finds the fix (or its equivalent) upstream.
blitz-dom = { git = "https://github.com/PoHsuanLai/blitz", rev = "70aa1bd8c9e489dd4294dabc58e3157cd718c770", default-features = false, features = ["svg", "system-fonts", "custom-widget", "accessibility"] }
blitz-paint = { git = "https://github.com/PoHsuanLai/blitz", rev = "70aa1bd8c9e489dd4294dabc58e3157cd718c770", features = ["custom-widget"] }
blitz-traits = { git = "https://github.com/PoHsuanLai/blitz", rev = "70aa1bd8c9e489dd4294dabc58e3157cd718c770" }
# The HTML parser (html5ever 0.39): an `<iframe srcdoc>` builds a real sub-document. ds-blitz
# installs it in headless documents; the window gets it through dioxus-native's `html` feature.
blitz-html = { git = "https://github.com/PoHsuanLai/blitz", rev = "70aa1bd8c9e489dd4294dabc58e3157cd718c770" }
dioxus-native-dom = { git = "https://github.com/PoHsuanLai/blitz", rev = "70aa1bd8c9e489dd4294dabc58e3157cd718c770", default-features = false, features = ["svg", "system-fonts", "accessibility"] }
# The portable window path for apps (winit); the shell uses shell-host instead.
dioxus-native = { git = "https://github.com/PoHsuanLai/blitz", rev = "70aa1bd8c9e489dd4294dabc58e3157cd718c770", default-features = false, features = ["vello-hybrid", "svg", "system-fonts", "accessibility"] }
# The window shell under dioxus-native, named for `ds_blitz::open_window`: its proxy and window
# config types build a second DioxusNativeApplication on the same event loop. dioxus-native's
# own `dioxus:` asset resolver and link opener come with it (both already in the tree through
# dioxus-native, same versions), since ds-blitz now builds the window's document itself.
blitz-shell = { git = "https://github.com/PoHsuanLai/blitz", rev = "70aa1bd8c9e489dd4294dabc58e3157cd718c770", default-features = false }
dioxus-asset-resolver = { version = "0.7", features = ["native"] }
webbrowser = "1.0"
# The system clipboard's text/html, for an edit surface's paste (ds-blitz): blitz-shell's own
# arboard (its `clipboard` feature, same features), read directly since ShellProvider has text only.
arboard = { version = "3.6", default-features = false }

# Dioxus 0.7.x (renderer-free core; mailo is on 0.7.10).
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"] }
dioxus-document = "0.7"

# Render stack, matched to blitz's lockfile at the rev above.
anyrender = "0.13"
anyrender_vello_hybrid = "0.10"
anyrender_vello_cpu = { version = "0.17", features = ["multithreading", "filters"] }
vello_hybrid = "0.1"
wgpu = "29"
wgpu_context = "0.9"
# Per-device image cache for the shared hybrid renderer (SPIKE.md S1 finding 5).
rustc-hash = "2"
vello_common = "0.1"
parley = { version = "0.11.1", default-features = false, features = ["std", "xz"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }

# Wayland client (shell-host and sill share one sctk major: cosmic-client-toolkit uses 0.20).
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
xkbcommon = "0.8"
raw-window-handle = "0.6"
keyboard-types = { version = "0.7", features = ["serde"] }
cursor-icon = "1"

# Common.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
thiserror = "2"
# Local wall-clock time with the system time zone (the bar clock); std cannot answer it.
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Safe syscalls where std has none: SOCK_SEQPACKET for the palmrest socket (shell-host
# input/palmrest.rs, palmrest), hidraw/uinput ioctls (palmrest). Already in every tree through
# wayland-backend at 1.1.x; the features are the union of both users.
rustix = { version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"] }
futures-timer = "3"
cssparser = "0.37"
notify = "8.2"
# zbus: shell repos (sill, shell-host) and programs that own their tokio runtime (anyview) take
# this tokio line and also enable `ds-settings/tokio`. quire and the other app repos take `zbus = { version = "5.19" }` with its default async-io backend: a library
# must not pick the executor for its consumers (mailo's blocking keyring calls under a tokio runtime
# panicked when ds-settings forced zbus/tokio through feature unification).
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
dirs = "6"
toml = "1"
# SSR renders for component goldens and markup lint (dev-dependency in consumers).
dioxus-ssr = "0.7"
# Named directly for image paints in custom widgets (blitz re-exports nothing).
peniko = "0.6"
# PDF output (ds-blitz `pdf`): pdfrum, the user's own pure-Rust PDF library
# (github.com/PoHsuanLai/pdfrum, MIT OR Apache-2.0). `pdfrum-anyrender` is the anyrender painter
# (scenes as vector PDF pages); it writes through pdfrum-edit (glyph-run fonts subset and
# instanced, gradients, JPEG and PNG passthrough; `variable-fonts` lets the subsetter instance
# variable and CFF2 faces). Every pdfrum crate comes from crates.io at one minor (0.5), so the tree holds
# one copy of each (as quire's own manifest does).
pdfrum-anyrender = "0.5"
pdfrum-edit = { version = "0.5", features = ["variable-fonts"] }
pdfrum-object = "0.5"
pdfrum-common = "0.5"
# Font tables read directly by ds-blitz's tests (cmap): the version parley already resolves at
# the blitz rev. pdfrum pins its own skrifa for its painter; the two do not meet in a signature.
skrifa = "0.44"
# Reading PDFs back in tests (text, fonts, images, a rasterised page): dev-dependency only.
pdfrum = { version = "0.5", default-features = false, features = ["vello-cpu"] }
# The print portal's fd, from a sealed anonymous file (ds-blitz's `print` feature, Linux only).
memfd = "0.6"
# Spellchecking (ds-blitz's `spell` feature): a pure-Rust Hunspell-compatible checker,
# MPL-2.0 (file-level copyleft, allowed by deny.toml), used unmodified. Dictionaries are the
# system's (/usr/share/hunspell); none is bundled.
spellbook = "0.4"
# Proc-macro crates for ds-settings-derive.
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"

# Shell-only (COSMIC).
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", rev = "c0cff4db14c37ed954983158e4055aa94c7741d9" }
upower_dbus = { git = "https://github.com/pop-os/dbus-settings-bindings", rev = "eed01dd3609e90e3c8cd043656734c500956c793" }
cosmic-dbus-networkmanager = { git = "https://github.com/pop-os/dbus-settings-bindings", rev = "eed01dd3609e90e3c8cd043656734c500956c793" }
logind-zbus = "5"
libpulse-binding = "2.30"
system-tray = "0.8.9"
freedesktop-desktop-entry = "0.8.3"
freedesktop-icons = "0.4"
nucleo-matcher = "0.3.1"
fend-core = "1.5.8"
clap = { version = "4", features = ["derive"] }
# Single instance without D-Bus: one agent per user over a Unix socket or a named pipe, found by an
# advisory lock (github.com/PoHsuanLai/latchkey, MIT OR Apache-2.0). Taken at a full SHA, as docket and porter are;
# `anyview-platform` uses it wherever the D-Bus instance (feature `quire-desktop`) is not built.
# docket, at the desktop manifest's rev; porter at the rev docket itself pins, with the same URL
# spelling, so Cargo sees one copy of each. `docket-client`'s `dbus` feature serves
# `org.quire.IntentProvider1`; `prov` is the label and name vocabulary its signatures use.
docket-client = { git = "https://github.com/PoHsuanLai/docket.git", rev = "3feb56fcbcf6d1567b2cec2a7d562cc86304afc9", default-features = false, features = ["dbus"] }
docket-core = { git = "https://github.com/PoHsuanLai/docket.git", rev = "3feb56fcbcf6d1567b2cec2a7d562cc86304afc9" }
prov = { git = "https://github.com/PoHsuanLai/porter.git", rev = "3d05f0a185fdae1e2d10c47ddb48f1c1ff0c7f20" }
porter-core = { git = "https://github.com/PoHsuanLai/porter.git", rev = "3d05f0a185fdae1e2d10c47ddb48f1c1ff0c7f20" }
latchkey = { git = "https://github.com/PoHsuanLai/latchkey", rev = "335d7a7c65bc7d196d5f19dfb305896ff3a55958" }
# ---- Companion / agent stack (agent-spec section 1.4) ----
# Policy point: cedar-policy's lalrpop tree passes `cargo deny check licenses` (spike S-Cedar).
cedar-policy = "4.13"
# actions-mcp: pin the minor.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
# model-http: one HTTP stack, Unix sockets. The cloud TLS stack is rustls, never OpenSSL.
hyper = "1"
hyper-util = "0.1.21"
http-body-util = "0.1"
hyper-rustls = "0.27"
rustls = "0.23"
base64 = "0.22"
fast_image_resize = "6.1.0"
blake3 = "1"
# almanac-seal.
chacha20poly1305 = "0.10"
zeroize = "1"
getrandom = "0.3"
# eventlog, recall: SQLCipher built from source with a vendored OpenSSL (spike S-SQL: FTS5 works
# in an encrypted DB, a wrong key fails, licences pass the allow-list).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
tar = "0.4"
oo7 = "0.6"
# recall-fastembed only; excluded from the gate.
fastembed = "7.1"
# The minor cosmic-comp's lock resolves.
reis = "0.7"
atspi = "0.30"
# voiced (docket): the capture device through pipewire-rs, MIT (libpipewire through bindgen;
# agent-spec voice.md section 2.3, spike V-A).
pipewire = "0.10"
# Dev-dependencies.
proptest = "1"
tempfile = "3"
# ---- END PINNED BLOCK ----

# anyview-only, outside the pinned block (they are not shared with quire, shell-host or sill).
# Magic-byte file type detection: MIT. `anyview-core` sniffs a file's first 4 KiB with it.
infer = "0.19"
# Decoders and codecs of `anyview-image`. `image` itself is pinned above with png and jpeg only; the
# crate adds the other formats through its own feature list (FINDINGS: pinned features).
# JPEG XL decoder, pure Rust: MIT OR Apache-2.0.
jxl-oxide = "0.12"
# SVG renderer, the version sill already resolves (0.48), without text so no font is read
# implicitly: MPL-2.0-free, Apache-2.0 OR MIT.
resvg = { version = "0.48", default-features = false }
# EXIF reader (library name `exif`): BSD-2-Clause.
kamadak-exif = "0.6"
# Splices EXIF and ICC segments in and out of JPEG, PNG and WebP containers: MIT OR Apache-2.0.
img-parts = "0.4"
# PSD (MIT OR Apache-2.0) and ICNS (MIT): pure Rust readers for the two container formats `image` lacks.
psd = "0.3.5"
icns = { version = "0.3", default-features = false }
# AVIF encoder, pure Rust: BSD-3-Clause.
ravif = { version = "0.13", default-features = false }
# Unbounded channel whose receiver is a future, so a worker's result wakes the window's UI task:
# MIT OR Apache-2.0 (already in the tree through dioxus).
futures-channel = "0.3"
# `StreamExt::next` on that receiver, and the stream of a portal request's `Response` signals
# (`anyview-platform`): MIT OR Apache-2.0.
futures-util = { version = "0.3", default-features = false }
# `anyview-text`: syntax highlighting with the pure-Rust regex engine (no oniguruma): MIT. Only the
# dump loader: the syntaxes are packed by dev/syntax-dump, which is no member of this workspace.
syntect = { version = "5", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
# Markdown parser: MIT.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Delimited tables: MIT OR Unlicense.
csv = "1"
# Spreadsheets (XLSX, ODS, XLS, XLSB) read into cells, pure Rust: MIT.
calamine = { version = "0.36", default-features = false }
# `anyview-archive`: the XML parts of an office document that name its title and author: MIT.
quick-xml = "0.41"
# `anyview-archive`: listings of zip (central directory only; deflate to extract an entry): MIT.
zip = { version = "8", default-features = false, features = ["deflate"] }
# Tar archives, read as a stream: `tar` is in the pinned block (MIT OR Apache-2.0), with its default
# features (a workspace dependency cannot switch them off for one member).
# gzip streams, pure-Rust backend (already in the tree): MIT OR Apache-2.0.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Zstandard streams, pure Rust: MIT.
ruzstd = "0.9"
# xz fixtures for tests, pure Rust: MIT.
lzma-rs = "0.3"
# bzip2 streams, the pure-Rust libbz2-rs-sys back end: MIT OR Apache-2.0.
bzip2 = "0.6"
# xz streams, and the LZMA and LZMA2 decoders a 7z's packed header is checked through, pure Rust: Apache-2.0 (the 7z crate
# uses it). It streams a block, which `lzma-rs` below (the test fixtures' encoder) does not.
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz"] }
# 7z archives: Apache-2.0.
sevenz-rust2 = { version = "0.20", default-features = false }

# `anyview-book`: the package of an EPUB (container, package document, contents) as a read-only tree; tolerant of
# a DOCTYPE; MIT OR Apache-2.0 (already in the tree).
roxmltree = "0.21"

# `anyview-font`: the zlib streams inside a WOFF font, pure Rust: MIT OR Zlib OR Apache-2.0 (already in the tree).
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

# Text encodings other than Unicode: (Apache-2.0 OR MIT) AND BSD-3-Clause.
encoding_rs = "0.8"
# Grapheme and word boundaries for the text editor's caret motion: MIT OR Apache-2.0 (already in the tree).
unicode-segmentation = "1"

# `anyview-platform`: the one crate that names D-Bus and the freedesktop file formats.
# MD5 of a file URI, which names its thumbnail (the freedesktop thumbnail spec): MIT OR Apache-2.0.
md-5 = "0.10"
# Percent-encoding of a file URI: MIT OR Apache-2.0.
percent-encoding = "2"
# Reads and writes the PNG text chunks a thumbnail carries (Thumb::URI, Thumb::MTime): MIT OR Apache-2.0.
png = "0.18"
# TIFF read and write for edits that keep every page and tag; `image` already pulls it in with these defaults.
tiff = "0.11"
# `anyview-media` (feature `player`): playback into a caller-owned wgpu texture, MIT OR Apache-2.0; the
# rev is mpv-wgpu master. Only its `subprocess` feature is taken: the person's own `mpv` runs as a child
# process with mpv-wgpu's C plugin loaded into it, so no libmpv and no `rsmpv` is linked, and the
# distribution's GPL mpv stays a program we run (CONVENTIONS section 15).
mpv-wgpu-player = { git = "https://github.com/PoHsuanLai/mpv-wgpu", rev = "7aba35b3c75786f0b02a356f1d34d1ce888d1f48", default-features = false, features = ["subprocess"] }
# `anyview-peek` (feature `media`): a recording's facts, tags and cover without decoding it, pure Rust.
# `symphonia` reads audio (MP3, AAC and ALAC in MP4, FLAC, Ogg Vorbis and Opus, WAV, AIFF): MPL-2.0,
# metadata and probing only, no decoder is called. Features: the container readers and the tag formats.
symphonia = { version = "0.6", default-features = false, features = ["aac", "aiff", "alac", "flac", "id3v1", "id3v2", "ape", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
# `anyview-peek` (feature `media`): the movie header of an MP4, MOV or M4V (tracks, sizes, codecs,
# length, tags and cover), from Mozilla's parser: MPL-2.0.
mp4parse = "0.17"
# `anyview-peek` (feature `media`): the segment info, tracks, tags and attachments of a Matroska or
# WebM file: Zlib OR MIT OR Apache-2.0.
matroska-demuxer = "0.8"
# `anyview-media` (feature `audio`): the sound card, for the built-in audio player that plays when the
# person has no mpv. cpal's only dependency on Linux that is not Rust is libasound (an audio device
# library, no codec: PipeWire and PulseAudio answer through its `default` device). No JACK, no ASIO.
# Apache-2.0.
cpal = { version = "0.17", default-features = false }
# Blocks on the headless wgpu device's futures: `anyview-media` (feature `player`, to make the
# device a background session plays on) and its tests. Apache-2.0 OR MIT.
pollster = "0.4"

# `anyview`: moving a file to the freedesktop trash, in one call. Pure Rust on Linux (no bus): MIT.
trash = "5"

# The vello and anyrender forks (branch quire-filters) that make every CSS `filter` function paint
# on both backends. Copied from quire's root manifest at the rev pinned above; a dependency's
# [patch] is ignored by its consumers, so this workspace root has to repeat it. `anyview-peek` is
# the first crate here that names the renderer.
# vello and anyrender come from our forks (github.com/PoHsuanLai/vello and /anyrender, branch
# quire-filters): the colour matrix filter, multi-threaded filter layers and CSS filter lists, so
# every CSS `filter` function paints on both backends. Move back to crates.io once upstream has
# them (blitz-kit docs/blitz-gaps.md tracks the PRs).
[patch.crates-io]
vello_common = { git = "https://github.com/PoHsuanLai/vello", rev = "1722f6234e10b95d574d2252698a6cc7cdcadb82" }
vello_cpu = { git = "https://github.com/PoHsuanLai/vello", rev = "1722f6234e10b95d574d2252698a6cc7cdcadb82" }
vello_hybrid = { git = "https://github.com/PoHsuanLai/vello", rev = "1722f6234e10b95d574d2252698a6cc7cdcadb82" }
vello_sparse_shaders = { git = "https://github.com/PoHsuanLai/vello", rev = "1722f6234e10b95d574d2252698a6cc7cdcadb82" }
glifo = { git = "https://github.com/PoHsuanLai/vello", rev = "1722f6234e10b95d574d2252698a6cc7cdcadb82" }
anyrender = { git = "https://github.com/PoHsuanLai/anyrender", rev = "a0825ebfc0443f3ef0830c0e09f2d85df3da632b" }
anyrender_vello_cpu = { git = "https://github.com/PoHsuanLai/anyrender", rev = "a0825ebfc0443f3ef0830c0e09f2d85df3da632b" }
anyrender_vello_hybrid = { git = "https://github.com/PoHsuanLai/anyrender", rev = "a0825ebfc0443f3ef0830c0e09f2d85df3da632b" }
wgpu_context = { git = "https://github.com/PoHsuanLai/anyrender", rev = "a0825ebfc0443f3ef0830c0e09f2d85df3da632b" }
pixels_window_renderer = { git = "https://github.com/PoHsuanLai/anyrender", rev = "a0825ebfc0443f3ef0830c0e09f2d85df3da632b" }
# dioxus-core 0.7.10 can spin forever in VirtualDom::wait_for_work: a task woken and then cancelled
# before it is polled (a use_resource restart) leaves an empty entry in the dirty-task queue that
# pop_task never removes. Fixed upstream in DioxusLabs/dioxus#5554 (0.8-alpha only); this fork
# (github.com/PoHsuanLai/dioxus, branch quire-0.7) backports it onto 0.7.10. Remove when quire
# moves to dioxus 0.8.
dioxus-core = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
dioxus-core-types = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
generational-box = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
subsecond = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
subsecond-types = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

# Matching on our own enums names every variant, so adding one is a compile error wherever it
# matters (CONVENTIONS section 4; plan section 4.3). Tests may unwrap (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"

# Line tables only, as quire and sill build, locally and in CI: backtraces keep file and line,
# and a test binary links in a fraction of the memory and disk (full debuginfo made each link about
# 5.5 GB and one lane's target about 300 GB on the shared machine). `test` inherits `dev`.
[profile.dev]
debug = "line-tables-only"
