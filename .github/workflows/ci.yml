name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The runner ships toolchains this build never uses; removing them leaves room for the
      # workspace's test binaries.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # System libraries the build links (fontconfig, freetype, harfbuzz, libxml2, libpng, ...)
      # and the tools the install test and the notices script use. libdav1d is only for the
      # off-by-default AVIF feature that --all-features turns on; release builds link no codec.
      # libasound2-dev is for cpal (the built-in audio player's sound card, alsa-sys): an audio
      # device library, not a codec.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang \
            libfontconfig-dev libfreetype-dev libharfbuzz-dev libxml2-dev libpng-dev \
            zlib1g-dev libbz2-dev liblzma-dev libglib2.0-dev libdav1d-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libdbus-1-dev libasound2-dev \
            mesa-vulkan-drivers libvulkan1 \
            desktop-file-utils appstream python3

      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # Tests that need a GPU adapter, mpv, ffmpeg or a session bus skip themselves when it is
      # missing (the suite builds its own scratch dirs and fake buses).
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      # The viewer's own code builds with the Linux desktop's services off (quire design/36).
      - name: Portable build (no quire-desktop)
        run: bash scripts/check-portable.sh

      - name: Boundary and budgets
        run: bash scripts/check-boundary.sh

      - name: No linked codecs
        run: bash dev/no-linked-codecs.sh

      - name: Dependencies (advisories, bans, licenses, sources)
        run: bash scripts/check-deny.sh

      - name: Install test
        run: bash dev/install-test.sh

      - name: Metadata
        run: |
          desktop-file-validate dist/org.quire.Anyview.desktop
          appstreamcli validate --no-net dist/org.quire.Anyview.metainfo.xml

      - name: Notices are current
        run: |
          python3 scripts/third-party-notices.py "$RUNNER_TEMP/notices.md"
          diff -q "$RUNNER_TEMP/notices.md" THIRD-PARTY-NOTICES.md

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dev/syntax-dump

      - name: Syntax dump is current
        run: |
          bash dev/syntax-dump/build.sh
          git diff --exit-code --stat -- crates/anyview-text/src/code/syntaxes.packdump

  # The headless half of the library builds off Linux: what a mail client or a terminal links to
  # look at a file (anyview-peek without its `pane`, so no renderer and no window). Nothing in that
  # tree may be Linux-only. The viewer itself is a Linux desktop program and is gated above.
  peek-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Peek builds headless
        run: cargo check -p anyview-peek --no-default-features --locked

  peek-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Peek builds headless
        run: cargo check -p anyview-peek --no-default-features --locked
