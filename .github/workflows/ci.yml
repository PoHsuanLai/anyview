name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The runner ships toolchains this build never uses; removing them leaves room for the
      # workspace's test binaries.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # System libraries the build links (fontconfig, freetype, harfbuzz, libxml2, libpng, ...)
      # and the tools the install test and the notices script use. libdav1d is only for the
      # off-by-default AVIF feature that --all-features turns on; release builds link no codec.
      # libasound2-dev is for cpal (the built-in audio player's sound card, alsa-sys): an audio
      # device library, not a codec.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang \
            libfontconfig-dev libfreetype-dev libharfbuzz-dev libxml2-dev libpng-dev \
            zlib1g-dev libbz2-dev liblzma-dev libglib2.0-dev libdav1d-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libdbus-1-dev libasound2-dev \
            mesa-vulkan-drivers libvulkan1 \
            desktop-file-utils appstream python3

      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # Tests that need a GPU adapter, mpv, ffmpeg or a session bus skip themselves when it is
      # missing (the suite builds its own scratch dirs and fake buses); the player job below runs the
      # ones that need mpv with it installed.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      # The viewer's own code builds with the Linux desktop's services off (quire design/36).
      - name: Portable build (no quire-desktop)
        run: bash scripts/check-portable.sh

      - name: Boundary and budgets
        run: bash scripts/check-boundary.sh

      - name: No linked codecs
        run: bash dev/no-linked-codecs.sh

      - name: Dependencies (advisories, bans, licenses, sources)
        run: bash scripts/check-deny.sh

      - name: Install test
        run: bash dev/install-test.sh

      - name: Metadata
        run: |
          desktop-file-validate dist/org.quire.Anyview.desktop
          appstreamcli validate --no-net dist/org.quire.Anyview.metainfo.xml

      - name: Notices are current
        run: |
          python3 scripts/third-party-notices.py "$RUNNER_TEMP/notices.md"
          diff -q "$RUNNER_TEMP/notices.md" THIRD-PARTY-NOTICES.md

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dev/syntax-dump

      - name: Syntax dump is current
        run: |
          bash dev/syntax-dump/build.sh
          git diff --exit-code --stat -- crates/anyview-text/src/code/syntaxes.packdump

  # The player with the real mpv: Ubuntu's own, which loads mpv-wgpu's C plugin, drawing on lavapipe
  # (the software Vulkan driver). The gate job's tests skip themselves with no mpv; here a skip is a
  # failure (ANYVIEW_REQUIRE_PLAYER), so this job fails where the player could not run. It runs only
  # the test binaries that start a player, not the suite again.
  player:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANYVIEW_REQUIRE_PLAYER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # The gate job's libraries, plus mpv (the program that plays, not libmpv: nothing links it), a
      # software Vulkan driver for the window's device, and dbus-daemon for the private bus the
      # now-playing test starts.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang \
            libfontconfig-dev libfreetype-dev libharfbuzz-dev libxml2-dev libpng-dev \
            zlib1g-dev libbz2-dev liblzma-dev libglib2.0-dev libdav1d-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libdbus-1-dev libasound2-dev \
            mesa-vulkan-drivers libvulkan1 \
            mpv dbus
          mpv --version | head -n 1
          dbus-daemon --version | head -n 1

      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # mpv-wgpu's C plugin, at the rev Cargo.toml pins the player to, in a target directory of its
      # own (it is not part of this workspace). mpv-wgpu's own CI builds and tests it against the
      # same stock mpv.
      - name: Build mpv-wgpu's C plugin
        run: |
          rev=$(sed -n 's/^mpv-wgpu-player = .*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)
          test -n "$rev"
          git clone https://github.com/PoHsuanLai/mpv-wgpu "$RUNNER_TEMP/mpv-wgpu"
          git -C "$RUNNER_TEMP/mpv-wgpu" checkout "$rev"
          (cd "$RUNNER_TEMP/mpv-wgpu" && CARGO_TARGET_DIR="$RUNNER_TEMP/mpv-wgpu-target" \
            cargo build --release -p mpv-wgpu-cplugin --locked)
          plugin="$RUNNER_TEMP/mpv-wgpu-target/release/libmpv_wgpu_cplugin.so"
          test -f "$plugin"
          echo "MPV_WGPU_MPV=/usr/bin/mpv" >> "$GITHUB_ENV"
          echo "MPV_WGPU_CPLUGIN=$plugin" >> "$GITHUB_ENV"

      # The player's own tests, then the program's window and now-playing entry over a private bus
      # (filtered to the modules that start a player), then the pane with a player of its own.
      - name: Player tests
        run: |
          cargo test -p anyview-media --features player --test media --locked -- driver:: session::
          cargo test -p anyview --test anyview --locked -- media_hub:: mpris_bus::
          cargo test -p anyview-pane --features player --test pane --locked

  # The whole viewer builds off Linux (build only: nothing has run there). The workspace with every
  # default feature off, which is the portable build (no `quire-desktop`: no D-Bus, no Linux
  # services), then the viewer binary with the built-in audio player, then the pane with its player
  # host. The headless peek and the machines are checked alone as well, as an embedder takes them. The
  # video player (mpv-wgpu's host, over a memfd ring) is Linux's, so it is not part of these builds.
  peek-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Peek builds headless
        run: cargo check -p anyview-peek --no-default-features --locked

      - name: Machines build
        run: cargo check -p anyview-machines --locked

      - name: Workspace builds (portable features)
        run: cargo check --workspace --no-default-features --locked

      - name: Viewer builds (with the built-in audio player)
        run: cargo check -p anyview --no-default-features --features audio --locked

      - name: Pane builds (with its player host)
        run: cargo check -p anyview-pane --features player --locked

  peek-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Peek builds headless
        run: cargo check -p anyview-peek --no-default-features --locked

      - name: Machines build
        run: cargo check -p anyview-machines --locked

      - name: Workspace builds (portable features)
        run: cargo check --workspace --no-default-features --locked

      - name: Viewer builds (with the built-in audio player)
        run: cargo check -p anyview --no-default-features --features audio --locked

      - name: Pane builds (with its player host)
        run: cargo check -p anyview-pane --features player --locked
